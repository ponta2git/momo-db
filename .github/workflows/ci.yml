name: CI

on:
  push:
    branches: [master]

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    outputs:
      drizzle_changed: ${{ steps.changes.outputs.changed }}
    environment: CI Actions
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MOMO_DB_TEST_DATABASE: momo_db_test_notifications
      MOMO_DB_TEST_USER: postgres
      MOMO_DB_TEST_PORT: 5432
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: momo_db_test_notifications
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          # full history required for git diff $BEFORE..$SHA across multi-commit pushes
          fetch-depth: 0

      - name: Detect drizzle/ changes
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # First push to this branch has no previous commit (all-zeros SHA)
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$BEFORE" "$AFTER" -- drizzle/ | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: drizzle-kit check
        run: pnpm db:check:ci

      - name: Apply all migrations to fresh test database
        run: pnpm test:prepare

      - name: Notification database contracts
        run: pnpm test:integration

      - name: Existing database backup, restore and migration
        env:
          MOMO_DB_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test:migrations

  approve-migration:
    name: Approve production migration
    needs: ci
    if: needs.ci.outputs.drizzle_changed == 'true'
    runs-on: ubuntu-latest
    environment: production-db
    steps:
      - name: Confirm approved migration commit
        run: echo "Production migration approved for ${{ github.sha }}."

  migrate:
    name: Migrate Neon
    needs:
      - ci
      - approve-migration
    if: needs.ci.outputs.drizzle_changed == 'true'
    runs-on: ubuntu-latest
    # Serialize migrations: never cancel in-progress to avoid partial schema state
    concurrency:
      group: neon-migrate
      cancel-in-progress: false
    environment: CI Actions
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify migration connection
        run: pnpm db:preflight:ci

      - name: Run migration
        run: pnpm db:migrate:ci
